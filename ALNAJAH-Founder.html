<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>النجاح ALNAJAH — نسخة المؤسس</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E"><meta name="copyright" content="© 2026 ALNAJAH">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F6;--sf:#fff;--tx:#0F1B2A;--mu:#5B6B7B;--ln:#DCE3EA;--soft:#F4F7FA;--pri:#17324D;--hd:#122B44;--ac:#B45309;--neg:#B42318;--pos:#0F7B4F;--hi:#FFF4E5;--sh:0 1px 2px rgba(16,32,48,.06),0 8px 22px rgba(16,32,48,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C141D;--sf:#141F2B;--tx:#E8EEF4;--mu:#9BA9B7;--ln:#263543;--soft:#0F1923;--pri:#2F6EA8;--hd:#0A1724;--ac:#F0A04B;--neg:#F97066;--pos:#4CC38A;--hi:#2A2113;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0C141D;--sf:#141F2B;--tx:#E8EEF4;--mu:#9BA9B7;--ln:#263543;--soft:#0F1923;--pri:#2F6EA8;--hd:#0A1724;--ac:#F0A04B;--neg:#F97066;--pos:#4CC38A;--hi:#2A2113;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,sans-serif;font-size:16px;line-height:1.55}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(135deg,var(--hd),#244B73);color:#fff;padding:10px 24px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
header b{font-size:26px;line-height:1}header span{font-size:13px;letter-spacing:.4em;color:#F2B35E;font-weight:500;direction:ltr}
.lg{display:inline-flex;width:40px;height:40px;border-radius:12px;background:#F2B35E;color:#17324D;font-weight:700;font-size:23px;align-items:center;justify-content:center;font-style:normal}
.hb{background:none;border:0;color:inherit;font:inherit;display:flex;align-items:center;gap:12px;cursor:pointer;padding:0}
.app{display:grid;grid-template-columns:240px 1fr;gap:22px;max-width:1240px;margin:0 auto;padding:22px}
.sb{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:84px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px;box-shadow:var(--sh)}
.sb button{min-height:46px;text-align:start;padding:0 12px;border:0;border-inline-start:4px solid transparent;border-radius:10px;background:none;color:var(--tx);font:500 15px inherit;font-family:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sb button:hover{background:var(--soft)}
.sb button.on{background:var(--soft);color:var(--pri);border-inline-start-color:var(--ac);font-weight:700}
:root[data-theme="dark"] .sb button.on{color:var(--tx)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sb button.on{color:var(--tx)}}
.nl{display:flex;align-items:center;gap:10px}.ic{flex:none;color:var(--ac)}
.sb i{font-style:normal;background:var(--neg);color:#fff;border-radius:10px;padding:0 8px;font-size:12px}
main{min-width:0}
h2{margin:0 0 16px;font-size:24px;display:flex;align-items:center;gap:10px}h2::before{content:'';width:6px;height:24px;border-radius:3px;background:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--mu);flex:1;min-width:140px}
input,select,textarea{height:46px;border:1px solid var(--ln);border-radius:10px;padding:0 12px;background:var(--soft);color:var(--tx);font:16px inherit;font-family:inherit;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(180,83,9,.18);outline:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.btn{min-height:46px;padding:0 20px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:700 15px inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn.o{background:none;color:var(--pri);border:1.5px solid var(--pri);box-shadow:none}
:root[data-theme="dark"] .btn.o{color:var(--tx);border-color:var(--ln)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.o{color:var(--tx);border-color:var(--ln)}}
.btn.g{background:#1E8E5A}
.chip{margin-top:8px;font-size:15px;min-height:24px;color:var(--mu)}
.neg{color:var(--neg);font-weight:700}.pos{color:var(--pos);font-weight:700}
.r{display:grid;grid-template-columns:minmax(0,1fr) 62px 84px 84px 36px;gap:6px;align-items:center;margin-bottom:8px}
.r.h{font-size:13px;color:var(--mu);margin-bottom:4px}
.r output{font-weight:700;text-align:end;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border:0;border-radius:8px;background:none;color:var(--neg);font-size:22px;cursor:pointer}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 10px;border-bottom:1px solid var(--ln);text-align:start;white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:13px;background:var(--soft)}
tr:hover td{background:var(--soft)}
td.w{white-space:normal;min-width:180px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.cards .card{margin:0;border-top:4px solid var(--ac)}.cards .card.gp{border-top-color:var(--pos)}.cards .card.gn{border-top-color:var(--neg)}
.cards small{color:var(--mu)}.cards b{display:block;font-size:26px;line-height:1.3}
.rem{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--ln)}
.alert{background:var(--hi);border-color:var(--ac)}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin:12px 0}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:12px;z-index:20;display:none;box-shadow:var(--sh)}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--tx);width:min(92vw,380px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;min-height:124px;text-align:start;padding:18px;border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--tx);font-family:inherit;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile b{font-size:19px}.tile>span:not(.ti){color:var(--mu);font-size:14px}
.ti{width:46px;height:46px;border-radius:13px;background:var(--soft);color:var(--ac);display:flex;align-items:center;justify-content:center;margin-bottom:4px}.ti svg{width:24px;height:24px}
.bars{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.bc{display:flex;flex-direction:column;align-items:center;min-width:38px;flex:1}.bt{height:130px;display:flex;align-items:flex-end;justify-content:center;width:100%}
.bb{width:100%;max-width:34px;background:var(--pos);border-radius:6px 6px 0 0}.bb.bn{background:var(--neg)}.bv{font-size:10px;color:var(--mu)}.bl{font-size:11px;color:var(--mu);margin-top:4px}
#gate{display:none;max-width:470px;margin:28px auto;padding:0 16px}
#gate .card{padding:24px}#gate h2{justify-content:center}#gate h2::before{display:none}
.gl{display:flex;flex-direction:column;align-items:center;margin-bottom:16px}.gl .lg{width:60px;height:60px;font-size:34px;border-radius:18px;margin-bottom:8px}.gl b{font-size:28px}.gl span{font-size:13px;letter-spacing:.4em;color:var(--ac);font-weight:700;direction:ltr}
footer{text-align:center;color:var(--mu);font-size:13px;padding:18px}
#pj{display:none}#pj table{margin-bottom:12px}
@media(max-width:760px){.app{grid-template-columns:1fr;padding:12px}.sb{flex-direction:row;overflow-x:auto;position:static;padding:8px}.sb button{white-space:nowrap;flex:none;min-height:44px}header{padding:10px 14px}header b{font-size:22px}}
@media print{#toast{display:none!important}header,.sb,.noprint{display:none!important}.app{display:block;padding:0}body{background:#fff;color:#000}#gate{display:none!important}body.pj .app,body.pj header,body.pj footer{display:none!important}body.pj #pj{display:block;padding-bottom:70px}#pj,#pj *{color:#000!important}#pj th{font-weight:700;background:none}#pj td,#pj th{white-space:normal}
.ph{text-align:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px}.pn{font-size:28px;font-weight:700}.pm{font-size:14px}.pt{text-align:center;justify-content:center}.pt::before{display:none}
.pf{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:12px;border-top:1px solid #000;padding:6px 0;background:#fff}}
.plg{display:block;margin:0 auto 8px;max-height:90px;max-width:260px;object-fit:contain}
</style>
</head>
<body>
<header><button class="hb" data-p="home" aria-label="القائمة الرئيسية"><i class="lg">ن</i><b>النجاح</b><span>ALNAJAH</span></button><small style="background:#F2B35E;color:#17324D;border-radius:6px;padding:2px 8px;font-weight:700;font-size:13px">نسخة المؤسس</small><button id="lo" class="btn" style="margin-inline-start:auto;display:none;background:#ffffff26">خروج</button></header><div id="gate"></div>
<div class="app"><nav class="sb" id="sb" aria-label="القائمة"></nav><main id="m"></main></div>
<footer id="cr"></footer><div id="pj"></div><div id="toast" role="status"></div>
<dialog id="xd"><h2>الخروج</h2><p>هل تريد أخذ نسخة احتياطية من بياناتك قبل الخروج؟</p><div class="row"><button class="btn" data-x="bk">نسخة احتياطية ثم خروج</button><button class="btn o" data-x="out">خروج فقط</button><button class="btn o" data-x="no">إلغاء</button></div></dialog><dialog id="dg"><h2>عميل جديد</h2><label>الاسم<input id="dn"></label><label style="margin-top:10px">رقم الواتساب (مع رمز الدولة أو يبدأ بـ 0)<input id="dp" type="tel" inputmode="tel" dir="ltr"></label><div class="row" style="margin-top:14px"><button class="btn" data-a="dsave">حفظ</button><button class="btn o" data-a="dcancel">إلغاء</button></div></dialog>
<script>
const K='alnajahF_v1',CC='964';let D={c:[],t:[]},page='sale',cur='';
try{D=JSON.parse(localStorage.getItem(K))||D}catch(e){}D.s=D.s||{pj:false};if(!D.c.some(c=>c.id==='cash'))D.c.unshift({id:'cash',name:'زبون نقدي',phone:''});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const days=d=>Math.floor((Date.now()-new Date(d))/864e5);
const byName=n=>D.c.find(x=>x.name.trim()===String(n).trim());
const cid=id=>D.c.find(x=>x.id===id);
const TN={sale:'بيع',purchase:'شراء',payment:'تسديد'};
const eff=t=>t.type==='sale'?t.total-t.paid:t.type==='purchase'?-(t.total-t.paid):(t.dir==='out'?t.total:-t.total);
const bal=id=>D.t.filter(t=>t.cid===id).reduce((a,t)=>a+eff(t),0);
const balTxt=b=>b>0?`<span class="neg">عليه ${fmt(b)}</span>`:b<0?`<span class="pos">له ${fmt(-b)}</span>`:'مسدد';
function oldest(id){let cr=0,db=[];D.t.filter(t=>t.cid===id).sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{if(t.type==='sale'){const d=t.total-t.paid;if(d>0)db.push({d,date:t.date})}else if(t.type==='purchase')cr+=t.total-t.paid;else if(t.dir==='out')db.push({d:t.total,date:t.date});else cr+=t.total});for(const x of db){if(cr>=x.d)cr-=x.d;else return x.date}return null}
function due(){return D.c.map(c=>{const b=bal(c.id),o=b>0?oldest(c.id):null;return{c,b,n:o?days(o):0}}).filter(x=>x.n>=30&&(!x.c.rem||days(x.c.rem)>=30))}
function wa(c,b,n){let p=(c.phone||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p=CC+p.slice(1);const m=`السلام عليكم ${c.name}، نذكّركم بوجود رصيد مستحق بقيمة ${fmt(b)} لدى النجاح (ALNAJAH) منذ ${n} يوماً. نرجو التسديد في أقرب وقت. شكراً لتعاونكم.`;return`https://wa.me/${p}?text=${encodeURIComponent(m)}`}
function toast(m,e){const t=$('#toast');t.textContent=m;t.style.display='block';t.style.background=e?'var(--neg)':'var(--tx)';t.style.color=e?'#fff':'var(--bg)';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2800)}
const NAV=[['home','القائمة الرئيسية'],['sale','البيع'],['purchase','الشراء'],['payment','التسديد'],['fin','العمليات المالية'],['profit','الأرباح'],['stmt','كشف حساب العميل'],['mat','المواد والأسعار'],['cust','العملاء'],['set','الإعدادات'],['founder','لوحة المؤسس']];
function nav(){$('#sb').innerHTML=NAV.filter(x=>(((x[0]!=='set'&&x[0]!=='profit')||adm()))&&(x[0]!=='founder'||(FOUNDER&&adm()))).map(([k,n])=>`<button data-p="${k}" class="${k===page?'on':''}"><span class="nl">${ico(k)}${n}</span>${k==='fin'&&due().length?`<i>${due().length}</i>`:''}</button>`).join('')}
const custPick=(extra='')=>`<div class="card"><div class="row"><label>العميل — ابحث بالاسم<input id="cn" list="cl" autocomplete="off" placeholder="اكتب اسم العميل" value="${esc(cur)}"></label><button class="btn o" data-a="newc">+ عميل جديد</button></div><div class="chip" id="cb"></div>${extra}</div><datalist id="cl">${D.c.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>`;
const rowH=()=>`<div class="r"><input class="n" list="ml" placeholder="المادة" aria-label="المادة"><input class="q" type="number" min="0" step="any" inputmode="decimal" value="1" aria-label="العدد"><input class="p" type="number" min="0" step="any" inputmode="decimal" placeholder="0" aria-label="السعر"><output class="s">0</output><button class="x" data-a="del" aria-label="حذف السطر">×</button></div>`;
function V(){const m=$('#m');nav();
if(page==='home'){homeV()}
else if(page==='sale'||page==='purchase'){if(!cur)cur='زبون نقدي';const s=page==='sale';
m.innerHTML=`<h2>${s?'فاتورة بيع':'فاتورة شراء'}</h2>`+custPick()+`<datalist id="ml">${D.m.map(x=>`<option value="${esc(x.n)}" label="${fmt(s?x.s:x.b)}">`).join('')}</datalist><div class="card"><div class="r h"><span>المادة</span><span>العدد</span><span>السعر</span><span>المجموع</span><span></span></div><div id="rows">${rowH()}</div><button class="btn o" data-a="add">+ إضافة مادة</button><div class="tot"><span>الإجمالي</span><b id="tt">0</b></div><div class="row"><label>المدفوع الآن<input id="pd" type="number" min="0" step="any" inputmode="decimal" value="0"></label><label>التاريخ<input id="dt" type="date" value="${today()}"></label><label>ملاحظة<input id="nt"></label></div><div class="tot"><span>المتبقي دين</span><b id="rm" class="neg">0</b></div><div class="row"><button class="btn" data-a="save">حفظ الفاتورة</button><button class="btn o" data-a="full">مدفوع بالكامل</button></div></div>`}
else if(page==='payment'){m.innerHTML=`<h2>تسديد</h2>`+custPick(`<div class="row" style="margin-top:12px"><label>النوع<select id="dr"><option value="in">استلام من العميل</option><option value="out">دفع للمورد / العميل</option></select></label><label>المبلغ<input id="am" type="number" min="0" step="any" inputmode="decimal"></label><label>التاريخ<input id="dt" type="date" value="${today()}"></label><label>ملاحظة<input id="nt"></label></div><div class="row" style="margin-top:12px"><button class="btn" data-a="pay">حفظ التسديد</button></div>`)}
else if(page==='fin'){const d=due(),S=t=>D.t.filter(x=>x.type===t).reduce((a,x)=>a+x.total,0),bs=D.c.map(c=>bal(c.id));
m.innerHTML=`<h2>العمليات المالية</h2><div class="cards"><div class="card"><small>ديون لنا</small><b class="neg">${fmt(bs.filter(b=>b>0).reduce((a,b)=>a+b,0))}</b></div><div class="card"><small>ديون علينا</small><b>${fmt(-bs.filter(b=>b<0).reduce((a,b)=>a+b,0))}</b></div><div class="card"><small>المبيعات</small><b>${fmt(S('sale'))}</b></div><div class="card"><small>المشتريات</small><b>${fmt(S('purchase'))}</b></div></div>`+JC()+(d.length?`<div class="card alert"><b>تذكيرات مستحقة (مرّ شهر على الدين)</b>${d.map(x=>`<div class="rem"><span>${esc(x.c.name)} — ${fmt(x.b)} منذ ${x.n} يوماً</span>${x.c.phone?`<a class="btn g" style="display:inline-flex;align-items:center;text-decoration:none" target="_blank" rel="noopener" data-rem="${x.c.id}" href="${wa(x.c,x.b,x.n)}">إرسال عبر واتساب</a>`:'<small>لا يوجد رقم</small>'}</div>`).join('')}</div>`:'<div class="card">لا توجد تذكيرات مستحقة الآن.</div>')+`<div class="card tw"><table><tr><th>التاريخ</th><th>النوع</th><th>العميل</th><th>المبلغ</th><th>المدفوع</th><th></th></tr>${[...D.t].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${t.date}</td><td>${TN[t.type]}</td><td>${esc(cid(t.cid)?.name)}</td><td>${fmt(t.total)}</td><td>${t.type==='payment'?'—':fmt(t.paid)}</td><td><button class="btn o" data-pi="${t.id}" style="min-height:36px;padding:0 12px">طباعة</button> ${adm()?`<button class="x" data-del="${t.id}" aria-label="حذف العملية">×</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد عمليات بعد.</td></tr>'}</table></div>`}
else if(page==='stmt'){m.innerHTML=`<h2>كشف حساب العميل</h2>`+custPick()+`<div id="sv"></div>`;stm()}
else if(page==='set'){setV()}
else if(page==='mat'){matV()}
else if(page==='profit'){profV()}
else if(page==='founder'){founderV()}
else{m.innerHTML=`<h2>العملاء</h2><div class="card"><button class="btn" data-a="newc">+ عميل جديد</button></div><div class="card tw"><table><tr><th>الاسم</th><th>الواتساب</th><th>الرصيد</th><th></th></tr>${D.c.map(c=>`<tr><td>${esc(c.name)}</td><td dir="ltr">${esc(c.phone)}</td><td>${balTxt(bal(c.id))}</td><td>${c.id!=='cash'?`<button class="btn o" data-ed="${c.id}">تعديل</button>`:''} ${adm()&&c.id!=='cash'?`<button class="x" data-dc="${c.id}" aria-label="حذف العميل">×</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4">أضف أول عميل.</td></tr>'}</table></div>`}

function pstm(){const c=byName($('#cn').value);if(!c)return;let r=0;const L=[];D.t.filter(t=>t.cid===c.id).sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{const it=(t.items||[]).map(i=>`${i.n} ${i.q}×${i.p}`).join('، ');if(t.type==='sale'){L.push([t.date,'بيع: '+it,t.total,0]);if(t.paid>0)L.push([t.date,'دفعة عند البيع',0,t.paid])}else if(t.type==='purchase'){L.push([t.date,'شراء: '+it,0,t.total]);if(t.paid>0)L.push([t.date,'دفعنا عند الشراء',t.paid,0])}else L.push([t.date,'تسديد '+(t.note||''),t.dir==='out'?t.total:0,t.dir==='out'?0:t.total])});
$('#pj').innerHTML=`${pHead()}<h2 class="pt">كشف حساب: ${esc(c.name)}</h2><p>التاريخ: ${today()} — الرصيد الحالي: <b>${balT(bal(c.id))}</b></p><table><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr>${L.map(l=>{r+=l[2]-l[3];return`<tr><td>${l[0]}</td><td>${esc(l[1])}</td><td>${l[2]?fmt(l[2]):''}</td><td>${l[3]?fmt(l[3]):''}</td><td>${fmt(r)}</td></tr>`}).join('')}</table>${pFoot()}`;document.body.classList.add('pj');window.print()}
let PR={f:'',t:''};const ago=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const pset=k=>{const t=today();PR=k==='0'?{f:t,t}:k==='7'?{f:ago(6),t}:k==='m'?{f:t.slice(0,8)+'01',t}:k==='y'?{f:t.slice(0,5)+'01-01',t}:{f:'',t:''}};
function costMap(){const q={},c={},m={};D.t.filter(t=>t.type==='purchase').forEach(t=>(t.items||[]).forEach(i=>{q[i.n]=(q[i.n]||0)+i.q;c[i.n]=(c[i.n]||0)+i.q*i.p}));Object.keys(q).forEach(n=>{if(q[n]>0)m[n]=c[n]/q[n]});D.m.forEach(x=>{if(m[x.n]===undefined&&x.b>0)m[x.n]=x.b});return m}
function profV(){if(!PR.f&&!PR.t&&!profV.i){pset('m');profV.i=1}
$('#m').innerHTML=`<h2>الأرباح</h2><div class="card"><div class="row"><button class="btn o" data-pr="0">اليوم</button><button class="btn o" data-pr="7">آخر 7 أيام</button><button class="btn o" data-pr="m">هذا الشهر</button><button class="btn o" data-pr="y">هذه السنة</button><button class="btn o" data-pr="a">الكل</button></div><div class="row" style="margin-top:12px"><label>من<input id="pf" type="date" value="${PR.f}"></label><label>إلى<input id="pt" type="date" value="${PR.t}"></label></div></div><div id="pr"></div>`;profT()}
function profT(){const m=costMap(),S=D.t.filter(t=>t.type==='sale'&&(!PR.f||t.date>=PR.f)&&(!PR.t||t.date<=PR.t));let rev=0,cost=0;const miss=new Set(),M={},Dy={};
S.forEach(t=>(t.items||[]).forEach(i=>{const r=i.q*i.p,c=m[i.n]===undefined?(miss.add(i.n),0):i.q*m[i.n];rev+=r;cost+=c;const x=M[i.n]||(M[i.n]={n:i.n,q:0,r:0,c:0});x.q+=i.q;x.r+=r;x.c+=c;Dy[t.date]=(Dy[t.date]||0)+r-c}));
const pr=rev-cost,mg=rev?Math.round(pr/rev*1000)/10:0,long=PR.f&&PR.t?(new Date(PR.t)-new Date(PR.f))/864e5>45:!PR.f;
const G={};Object.keys(Dy).forEach(k=>{const g=long?k.slice(0,7):k;G[g]=(G[g]||0)+Dy[k]});const ks=Object.keys(G).sort(),mx=Math.max(1,...ks.map(k=>Math.abs(G[k]))),rows=Object.values(M).sort((a,b)=>(b.r-b.c)-(a.r-a.c));
$('#pr').innerHTML=`<div class="cards"><div class="card"><small>المبيعات</small><b>${fmt(rev)}</b></div><div class="card"><small>تكلفة البضاعة المباعة</small><b>${fmt(cost)}</b></div><div class="card ${pr>=0?'gp':'gn'}"><small>صافي الربح</small><b class="${pr>=0?'pos':'neg'}">${fmt(pr)}</b></div><div class="card"><small>هامش الربح</small><b>${mg}%</b></div></div>`+(miss.size?`<div class="card alert">مواد بيعت بدون سعر شراء معروف (حُسبت تكلفتها صفراً): ${[...miss].map(esc).join('، ')}. سجّل لها فاتورة شراء أو سعر شراء في «المواد والأسعار» لتصبح الأرباح أدق.</div>`:'')+(ks.length?`<div class="card"><b>${long?'الربح الشهري':'الربح اليومي'}</b><div class="bars">${ks.map(k=>`<div class="bc" title="${k}: ${fmt(G[k])}"><div class="bv">${fmt(G[k])}</div><div class="bt"><div class="bb ${G[k]<0?'bn':''}" style="height:${Math.max(4,Math.round(Math.abs(G[k])/mx*100))}%"></div></div><div class="bl">${k.slice(long?2:5)}</div></div>`).join('')}</div></div>`:'')+`<div class="card tw"><b>الربح حسب المادة</b><table><tr><th>المادة</th><th>الكمية</th><th>المبيعات</th><th>التكلفة</th><th>الربح</th></tr>${rows.map(x=>`<tr><td>${esc(x.n)}</td><td>${fmt(x.q)}</td><td>${fmt(x.r)}</td><td>${fmt(x.c)}</td><td class="${x.r-x.c>=0?'pos':'neg'}">${fmt(x.r-x.c)}</td></tr>`).join('')||'<tr><td colspan="5">لا مبيعات في هذه الفترة.</td></tr>'}</table></div><p class="chip">الربح هنا إجمالي (المبيعات − تكلفة المواد المباعة). تكلفة كل مادة = متوسط أسعار شرائها في فواتير الشراء، وإن لم تسجّل شراءً لها فسعر الشراء من «المواد والأسعار». لا تشمل المصاريف.</p>`}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.dataset.pr===undefined)return;pset(t.dataset.pr);$('#pf').value=PR.f;$('#pt').value=PR.t;profT()});
document.addEventListener('change',e=>{const i=e.target;if(i.id==='pf'||i.id==='pt'){PR={f:$('#pf').value,t:$('#pt').value};profT()}if(['shn','shp','sha'].includes(i.id)){D.s.shop=Object.assign({},D.s.shop,{name:$('#shn').value.trim(),phone:$('#shp').value.trim(),addr:$('#sha').value.trim()});save();toast('تم حفظ بيانات المحل')}});
function expBk(){const j=JSON.stringify({app:'ALNAJAH',v:1,date:today(),c:D.c,t:D.t,m:D.m,shop:D.s.shop||{}});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='ALNAJAH-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();D.s.bk=today();save();toast('تم تنزيل النسخة الاحتياطية')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const x=t.dataset.x;if(x){$('#xd').close();if(x==='bk'){expBk();setTimeout(doExit,300)}else if(x==='out')doExit()}if(t.dataset.lg==='rm'){D.s.shop=Object.assign({},D.s.shop,{logo:''});save();toast('تم حذف الشعار');setV()}});
document.addEventListener('change',e=>{if(e.target.id!=='shl'||!e.target.files[0])return;const f=e.target.files[0];if(!/^image\//.test(f.type))return toast('اختر ملف صورة',1);const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const k=Math.min(1,500/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);let d=c.toDataURL('image/png');if(d.length>300000)d=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);if(d.length>600000)return toast('الصورة كبيرة، اختر صورة أصغر',1);D.s.shop=Object.assign({},D.s.shop,{logo:d});save();toast('تم حفظ الشعار');setV()};img.onerror=()=>toast('تعذّر قراءة الصورة',1);img.src=u});
let ed=null;boot();
</script>
</body>
</html>
