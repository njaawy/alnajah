<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>النجاح ALNAJAH — نسخة المؤسس</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E"><meta name="copyright" content="© 2026 ALNAJAH">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F6;--sf:#fff;--tx:#15202B;--mu:#566470;--ln:#D9DFE4;--pri:#17324D;--hd:#17324D;--ac:#B45309;--neg:#B42318;--pos:#0F7B4F;--hi:#FFF4E5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1720;--sf:#17212C;--tx:#E7EDF2;--mu:#9AA8B4;--ln:#2A3744;--pri:#2F6EA8;--hd:#0B1A2A;--ac:#F0A04B;--neg:#F97066;--pos:#4CC38A;--hi:#2A2113}}
:root[data-theme="dark"]{--bg:#0F1720;--sf:#17212C;--tx:#E7EDF2;--mu:#9AA8B4;--ln:#2A3744;--pri:#2F6EA8;--hd:#0B1A2A;--ac:#F0A04B;--neg:#F97066;--pos:#4CC38A;--hi:#2A2113}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,sans-serif;font-size:16px;line-height:1.5}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd);color:#fff;padding:12px 20px;display:flex;align-items:baseline;gap:12px}
header b{font-size:28px}header span{font-size:15px;letter-spacing:.35em;color:#F2B35E;font-weight:500;direction:ltr}
.app{display:grid;grid-template-columns:220px 1fr;gap:20px;max-width:1200px;margin:0 auto;padding:20px}
.sb{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:76px}
.sb button{min-height:48px;text-align:start;padding:0 14px;border:1px solid transparent;border-radius:10px;background:none;color:var(--tx);font:500 16px inherit;font-family:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sb button:hover{background:var(--sf)}
.sb button.on{background:var(--sf);border-color:var(--ln);border-inline-start:4px solid var(--ac);font-weight:700}
.sb i{font-style:normal;background:var(--neg);color:#fff;border-radius:10px;padding:0 8px;font-size:13px}
main{min-width:0}
h2{margin:0 0 14px;font-size:22px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mu);flex:1;min-width:140px}
input,select,textarea{height:44px;border:1px solid var(--ln);border-radius:8px;padding:0 10px;background:var(--bg);color:var(--tx);font:16px inherit;font-family:inherit;width:100%;min-width:0}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.btn{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:var(--pri);color:#fff;font:700 15px inherit;font-family:inherit;cursor:pointer}
.btn.o{background:none;color:var(--pri);border:1.5px solid var(--pri)}
:root[data-theme="dark"] .btn.o{color:var(--tx);border-color:var(--ln)}
.btn.g{background:#1E8E5A}
.chip{margin-top:8px;font-size:15px;min-height:24px}
.neg{color:var(--neg);font-weight:700}.pos{color:var(--pos);font-weight:700}
.r{display:grid;grid-template-columns:minmax(0,1fr) 62px 84px 84px 36px;gap:6px;align-items:center;margin-bottom:8px}
.r.h{font-size:13px;color:var(--mu);margin-bottom:4px}
.r output{font-weight:700;text-align:end;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border:0;border-radius:8px;background:none;color:var(--neg);font-size:22px;cursor:pointer}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:start;white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:13px}
td.w{white-space:normal;min-width:180px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.cards .card{margin:0}.cards small{color:var(--mu)}.cards b{display:block;font-size:22px}
.rem{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--ln)}
.alert{background:var(--hi);border-color:var(--ac)}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin:12px 0}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:10px;z-index:20;display:none}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);width:min(92vw,380px)}
@media(max-width:760px){.app{grid-template-columns:1fr;padding:12px}.sb{flex-direction:row;overflow-x:auto;position:static}.sb button{white-space:nowrap;flex:none}header b{font-size:24px}}
@media print{header,.sb,.noprint{display:none!important}.app{display:block}body{background:#fff;color:#000}}
#gate{display:none;max-width:460px;margin:24px auto;padding:0 16px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:16px}
#pj{display:none}#pj table{margin-bottom:12px}
@media print{#gate{display:none!important}body.pj .app,body.pj header,body.pj footer{display:none!important}body.pj #pj{display:block}}
.hb{background:none;border:0;color:inherit;font:inherit;display:flex;align-items:baseline;gap:12px;cursor:pointer;padding:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{min-height:96px;text-align:start;padding:16px;border:1px solid var(--ln);border-inline-start:5px solid var(--ac);border-radius:12px;background:var(--sf);color:var(--tx);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:19px}.tile span{color:var(--mu);font-size:14px}
@media print{#pj,#pj *{color:#000!important}#pj th{font-weight:700}}
</style>
</head>
<body>
<header><button class="hb" data-p="home" aria-label="القائمة الرئيسية"><b>النجاح</b><span>ALNAJAH</span></button><small style="background:#F2B35E;color:#17324D;border-radius:6px;padding:2px 8px;font-weight:700;font-size:13px">نسخة المؤسس</small><button id="lo" class="btn" style="margin-inline-start:auto;display:none;background:#ffffff26">خروج</button></header><div id="gate"></div>
<div class="app"><nav class="sb" id="sb" aria-label="القائمة"></nav><main id="m"></main></div>
<footer id="cr"></footer><div id="pj"></div><div id="toast" role="status"></div>
<dialog id="dg"><h2>عميل جديد</h2><label>الاسم<input id="dn"></label><label style="margin-top:10px">رقم الواتساب (مع رمز الدولة أو يبدأ بـ 0)<input id="dp" type="tel" inputmode="tel" dir="ltr"></label><div class="row" style="margin-top:14px"><button class="btn" data-a="dsave">حفظ</button><button class="btn o" data-a="dcancel">إلغاء</button></div></dialog>
<script>
const K='alnajahF_v1',CC='964';let D={c:[],t:[]},page='sale',cur='';
try{D=JSON.parse(localStorage.getItem(K))||D}catch(e){}D.s=D.s||{pj:false};if(!D.c.some(c=>c.id==='cash'))D.c.unshift({id:'cash',name:'زبون نقدي',phone:''});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const days=d=>Math.floor((Date.now()-new Date(d))/864e5);
const byName=n=>D.c.find(x=>x.name.trim()===String(n).trim());
const cid=id=>D.c.find(x=>x.id===id);
const TN={sale:'بيع',purchase:'شراء',payment:'تسديد'};
const eff=t=>t.type==='sale'?t.total-t.paid:t.type==='purchase'?-(t.total-t.paid):(t.dir==='out'?t.total:-t.total);
const bal=id=>D.t.filter(t=>t.cid===id).reduce((a,t)=>a+eff(t),0);
const balTxt=b=>b>0?`<span class="neg">عليه ${fmt(b)}</span>`:b<0?`<span class="pos">له ${fmt(-b)}</span>`:'مسدد';
function oldest(id){let cr=0,db=[];D.t.filter(t=>t.cid===id).sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{if(t.type==='sale'){const d=t.total-t.paid;if(d>0)db.push({d,date:t.date})}else if(t.type==='purchase')cr+=t.total-t.paid;else if(t.dir==='out')db.push({d:t.total,date:t.date});else cr+=t.total});for(const x of db){if(cr>=x.d)cr-=x.d;else return x.date}return null}
function due(){return D.c.map(c=>{const b=bal(c.id),o=b>0?oldest(c.id):null;return{c,b,n:o?days(o):0}}).filter(x=>x.n>=30&&(!x.c.rem||days(x.c.rem)>=30))}
function wa(c,b,n){let p=(c.phone||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p=CC+p.slice(1);const m=`السلام عليكم ${c.name}، نذكّركم بوجود رصيد مستحق بقيمة ${fmt(b)} لدى النجاح (ALNAJAH) منذ ${n} يوماً. نرجو التسديد في أقرب وقت. شكراً لتعاونكم.`;return`https://wa.me/${p}?text=${encodeURIComponent(m)}`}
function toast(m,e){const t=$('#toast');t.textContent=m;t.style.display='block';t.style.background=e?'var(--neg)':'var(--tx)';t.style.color=e?'#fff':'var(--bg)';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2800)}
const NAV=[['home','القائمة الرئيسية'],['sale','البيع'],['purchase','الشراء'],['payment','التسديد'],['fin','العمليات المالية'],['stmt','كشف حساب العميل'],['mat','المواد والأسعار'],['cust','العملاء'],['set','الإعدادات'],['founder','لوحة المؤسس']];
function nav(){$('#sb').innerHTML=NAV.filter(x=>(x[0]!=='set'||adm())&&(x[0]!=='founder'||(FOUNDER&&adm()))).map(([k,n])=>`<button data-p="${k}" class="${k===page?'on':''}">${n}${k==='fin'&&due().length?`<i>${due().length}</i>`:''}</button>`).join('')}
const custPick=(extra='')=>`<div class="card"><div class="row"><label>العميل — ابحث بالاسم<input id="cn" list="cl" autocomplete="off" placeholder="اكتب اسم العميل" value="${esc(cur)}"></label><button class="btn o" data-a="newc">+ عميل جديد</button></div><div class="chip" id="cb"></div>${extra}</div><datalist id="cl">${D.c.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>`;
const rowH=()=>`<div class="r"><input class="n" list="ml" placeholder="المادة" aria-label="المادة"><input class="q" type="number" min="0" step="any" inputmode="decimal" value="1" aria-label="العدد"><input class="p" type="number" min="0" step="any" inputmode="decimal" placeholder="0" aria-label="السعر"><output class="s">0</output><button class="x" data-a="del" aria-label="حذف السطر">×</button></div>`;
function V(){const m=$('#m');nav();
if(page==='home'){homeV()}
else if(page==='sale'||page==='purchase'){if(!cur)cur='زبون نقدي';const s=page==='sale';
m.innerHTML=`<h2>${s?'فاتورة بيع':'فاتورة شراء'}</h2>`+custPick()+`<datalist id="ml">${D.m.map(x=>`<option value="${esc(x.n)}" label="${fmt(s?x.s:x.b)}">`).join('')}</datalist><div class="card"><div class="r h"><span>المادة</span><span>العدد</span><span>السعر</span><span>المجموع</span><span></span></div><div id="rows">${rowH()}</div><button class="btn o" data-a="add">+ إضافة مادة</button><div class="tot"><span>الإجمالي</span><b id="tt">0</b></div><div class="row"><label>المدفوع الآن<input id="pd" type="number" min="0" step="any" inputmode="decimal" value="0"></label><label>التاريخ<input id="dt" type="date" value="${today()}"></label><label>ملاحظة<input id="nt"></label></div><div class="tot"><span>المتبقي دين</span><b id="rm" class="neg">0</b></div><div class="row"><button class="btn" data-a="save">حفظ الفاتورة</button><button class="btn o" data-a="full">مدفوع بالكامل</button></div></div>`}
else if(page==='payment'){m.innerHTML=`<h2>تسديد</h2>`+custPick(`<div class="row" style="margin-top:12px"><label>النوع<select id="dr"><option value="in">استلام من العميل</option><option value="out">دفع للمورد / العميل</option></select></label><label>المبلغ<input id="am" type="number" min="0" step="any" inputmode="decimal"></label><label>التاريخ<input id="dt" type="date" value="${today()}"></label><label>ملاحظة<input id="nt"></label></div><div class="row" style="margin-top:12px"><button class="btn" data-a="pay">حفظ التسديد</button></div>`)}
else if(page==='fin'){const d=due(),S=t=>D.t.filter(x=>x.type===t).reduce((a,x)=>a+x.total,0),bs=D.c.map(c=>bal(c.id));
m.innerHTML=`<h2>العمليات المالية</h2><div class="cards"><div class="card"><small>ديون لنا</small><b class="neg">${fmt(bs.filter(b=>b>0).reduce((a,b)=>a+b,0))}</b></div><div class="card"><small>ديون علينا</small><b>${fmt(-bs.filter(b=>b<0).reduce((a,b)=>a+b,0))}</b></div><div class="card"><small>المبيعات</small><b>${fmt(S('sale'))}</b></div><div class="card"><small>المشتريات</small><b>${fmt(S('purchase'))}</b></div></div>`+JC()+(d.length?`<div class="card alert"><b>تذكيرات مستحقة (مرّ شهر على الدين)</b>${d.map(x=>`<div class="rem"><span>${esc(x.c.name)} — ${fmt(x.b)} منذ ${x.n} يوماً</span>${x.c.phone?`<a class="btn g" style="display:inline-flex;align-items:center;text-decoration:none" target="_blank" rel="noopener" data-rem="${x.c.id}" href="${wa(x.c,x.b,x.n)}">إرسال عبر واتساب</a>`:'<small>لا يوجد رقم</small>'}</div>`).join('')}</div>`:'<div class="card">لا توجد تذكيرات مستحقة الآن.</div>')+`<div class="card tw"><table><tr><th>التاريخ</th><th>النوع</th><th>العميل</th><th>المبلغ</th><th>المدفوع</th><th></th></tr>${[...D.t].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${t.date}</td><td>${TN[t.type]}</td><td>${esc(cid(t.cid)?.name)}</td><td>${fmt(t.total)}</td><td>${t.type==='payment'?'—':fmt(t.paid)}</td><td><button class="btn o" data-pi="${t.id}" style="min-height:36px;padding:0 12px">طباعة</button> ${adm()?`<button class="x" data-del="${t.id}" aria-label="حذف العملية">×</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد عمليات بعد.</td></tr>'}</table></div>`}
else if(page==='stmt'){m.innerHTML=`<h2>كشف حساب العميل</h2>`+custPick()+`<div id="sv"></div>`;stm()}
else if(page==='set'){setV()}
else if(page==='mat'){matV()}
else if(page==='founder'){founderV()}
else{m.innerHTML=`<h2>العملاء</h2><div class="card"><button class="btn" data-a="newc">+ عميل جديد</button></div><div class="card tw"><table><tr><th>الاسم</th><th>الواتساب</th><th>الرصيد</th><th></th></tr>${D.c.map(c=>`<tr><td>${esc(c.name)}</td><td dir="ltr">${esc(c.phone)}</td><td>${balTxt(bal(c.id))}</td><td>${c.id!=='cash'?`<button class="btn o" data-ed="${c.id}">تعديل</button>`:''} ${adm()&&c.id!=='cash'?`<button class="x" data-dc="${c.id}" aria-label="حذف العميل">×</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4">أضف أول عميل.</td></tr>'}</table></div>`}
const cn=$('#cn');if(cn)pick()}
function pick(){const c=byName($('#cn').value);cur=$('#cn').value;$('#cb').innerHTML=c?'الرصيد الحالي: '+balTxt(bal(c.id)):'';return c}
function stm(){const c=pick(),v=$('#sv');if(!v)return;if(!c){v.innerHTML='';return}let r=0,L=[];D.t.filter(t=>t.cid===c.id).sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{const it=(t.items||[]).map(i=>`${i.n} ${i.q}×${i.p}`).join('، ');if(t.type==='sale'){L.push([t.date,'بيع: '+it,t.total,0]);if(t.paid>0)L.push([t.date,'دفعة عند البيع',0,t.paid])}else if(t.type==='purchase'){L.push([t.date,'شراء: '+it,0,t.total]);if(t.paid>0)L.push([t.date,'دفعنا عند الشراء',t.paid,0])}else L.push([t.date,'تسديد '+(t.note||''),t.dir==='out'?t.total:0,t.dir==='out'?0:t.total])});
v.innerHTML=`<div class="card tw"><h3 style="margin-top:0">${esc(c.name)} — ${balTxt(bal(c.id))}</h3><table><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr>${L.map(l=>{r+=l[2]-l[3];return`<tr><td>${l[0]}</td><td class="w">${esc(l[1])}</td><td>${l[2]?fmt(l[2]):''}</td><td>${l[3]?fmt(l[3]):''}</td><td>${fmt(r)}</td></tr>`}).join('')||'<tr><td colspan="5">لا توجد حركات.</td></tr>'}</table><div class="row noprint" style="margin-top:12px"><button class="btn" data-a="print">طباعة الكشف</button>${r>0&&c.phone?`<a class="btn g" style="display:inline-flex;align-items:center;text-decoration:none" target="_blank" rel="noopener" data-rem="${c.id}" href="${wa(c,r,days(oldest(c.id)||today()))}">تذكير عبر واتساب</a>`:''}</div></div>`}
function calc(auto){let t=0;$$('#rows .r').forEach(r=>{const s=(+r.querySelector('.q').value||0)*(+r.querySelector('.p').value||0);r.querySelector('.s').textContent=fmt(s);t+=s});$('#tt').textContent=fmt(t);const cc=byName($('#cn').value);if(auto!==false&&cc&&cc.id==='cash'&&$('#pd').dataset.man!=='1')$('#pd').value=t;$('#rm').textContent=fmt(Math.max(0,t-(+$('#pd').value||0)));return t}
function needC(){const c=byName($('#cn').value);if(!c)toast('اختر العميل من القائمة أو أضفه بزر عميل جديد',1);return c}
document.addEventListener('input',e=>{if(e.target.id==='pd')e.target.dataset.man='1';if(e.target.closest('#rows')||e.target.id==='pd')calc(e.target.id!=='pd');if(e.target.id==='cn'){page==='stmt'?stm():(pick(),$('#rows')&&(($('#pd').dataset.man=''),calc()))}});

document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;const a=t.dataset.a;
if(t.dataset.p){page=t.dataset.p;cur='';V();return}
if(t.dataset.pi){const x=D.t.find(q=>q.id===t.dataset.pi);if(x)pinv(x);return}
if(t.dataset.rem){const c=cid(t.dataset.rem);c.rem=today();save();setTimeout(V,400);return}
if(t.dataset.del){if(confirm('حذف هذه العملية؟')){D.t=D.t.filter(x=>x.id!==t.dataset.del);save();V()}return}
if(t.dataset.dc){if(D.t.some(x=>x.cid===t.dataset.dc))return toast('لا يمكن حذف عميل له عمليات',1);if(confirm('حذف العميل؟')){D.c=D.c.filter(x=>x.id!==t.dataset.dc);save();V()}return}
if(t.dataset.ed){const c=cid(t.dataset.ed);ed=c.id;$('#dn').value=c.name;$('#dp').value=c.phone||'';$('#dg').showModal();return}
if(a==='newc'){ed=null;$('#dn').value='';$('#dp').value='';$('#dg').showModal()}
else if(a==='dcancel')$('#dg').close();

<script>
// ===== ALNAJAH FOUNDER LINK PATCH - قراءة طلبات المشتري =====
(function(){
  const SHARED_KEY = 'alnajah_shared_orders';
  const FOUNDER_PENDING_KEY = 'alnajah_auth'; // buyer auth
  const orig_boot = window.boot;
  // Override to merge shared orders into view
  function getMergedPending(){
    let shared = [];
    try{ shared = JSON.parse(localStorage.getItem(SHARED_KEY)||'[]'); }catch(e){}
    let founderAuth = [];
    try{
      const fa = JSON.parse(localStorage.getItem('alnajahF_auth')||localStorage.getItem('alnajah_auth')||'{}');
      // founder also might have its own users, merge
    }catch(e){}
    return shared.filter(u=>u.st==='pending');
  }
  // Patch pendH if exists to use shared
  const checkInterval = setInterval(()=>{
    if(typeof window.pendH !== 'undefined' || document.getElementById('m')){
      // inject listener to show shared pending in founder dashboard
      const orig_pendH = window.pendH;
      if(orig_pendH && !window.pendH.patched){
        window.pendH = function(){
          let shared = [];
          try{ shared = JSON.parse(localStorage.getItem(SHARED_KEY)||'[]'); }catch(e){}
          const pendingFromShared = shared.filter(u=>u.st==='pending');
          const P = pendingFromShared;
          if(!P.length) return '';
          return `<div class="card alert"><b>طلبات إنشاء حساب من المشتري (مرتبط)</b>${P.map(u=>`<div class="rem"><span>${u.u} - ${u.u}</span><span><button class="btn g" data-ap="${u.u}">قبول</button> <button class="btn o" data-rj="${u.u}">رفض</button></span></div>`).join('')}</div>`;
        };
        window.pendH.patched = true;
      }
      // Also patch click handler to update shared
      document.addEventListener('click', function(e){
        const t = e.target.closest('button');
        if(!t) return;
        const name = t.dataset.ap || t.dataset.rj;
        if(!name) return;
        try{
          let shared = JSON.parse(localStorage.getItem(SHARED_KEY)||'[]');
          const u = shared.find(x=>x.u===name);
          if(u){
            u.st = t.dataset.ap ? 'ok' : 'rejected';
            localStorage.setItem(SHARED_KEY, JSON.stringify(shared));
            // also update buyer auth if exists
            let buyerAuth = JSON.parse(localStorage.getItem('alnajah_auth')||'{}');
            if(buyerAuth.users){
              const bu = buyerAuth.users.find(x=>x.u===name);
              if(bu) bu.st = u.st;
              localStorage.setItem('alnajah_auth', JSON.stringify(buyerAuth));
            }
          }
        }catch(err){}
      });
      clearInterval(checkInterval);
    }
  }, 500);

  console.log('Founder link patch loaded - يقرأ من المشتري');
})();
</script>
